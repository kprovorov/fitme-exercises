name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    env:
      # Never download LFS content: the loader reads content hashes and sizes
      # from the pointer files.
      GIT_LFS_SKIP_SMUDGE: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: false
          # The whole history, so the checks below can compare against the
          # base branch.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format (ultracite)
        run: pnpm check

      # Runs on pull requests only: a workflow_call (release) has no base
      # branch to compare with.
      - name: Check no Exercise slug was removed
        if: github.event_name == 'pull_request'
        run: scripts/check-exercise-slugs.sh "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate the Exercise Library
        run: pnpm validate --require-lfs-pointers

      # The bundle the release publishes, from the LFS pointers alone.
      - name: Bundle the Exercise Library
        run: pnpm bundle
